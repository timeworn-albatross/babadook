<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Abnormality Journal</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <h1>Abnormality Journal</h1>

    <section class="panel">
      <h2>Evidence Found</h2>

      <div class="evidence-list">
        <button class="evidence-option" data-evidence="EMF 5" data-state="unknown">
            EMF 5
        </button>

        <button class="evidence-option" data-evidence="Freezing Temperatures" data-state="unknown">
            Freezing Temperatures
        </button>

        <button class="evidence-option" data-evidence="Ghost Orbs" data-state="unknown">
            Ghost Orbs
        </button>

        <button class="evidence-option" data-evidence="Ghost Writing" data-state="unknown">
            Ghost Writing
        </button>

        <button class="evidence-option" data-evidence="Laser Grid" data-state="unknown">
            Laser Grid
        </button>

        <button class="evidence-option" data-evidence="Spirit Box" data-state="unknown">
            Spirit Box
        </button>

        <button class="evidence-option" data-evidence="UV Light" data-state="unknown">
            UV Light
        </button>
      </div>

      <button class="reset-button" type="button">
          Reset Evidence
      </button>
    </section>

    <section class="panel">
      <h2>Possible Ghosts</h2>

      <ul class="ghost-list">
        <li>Example Ghost</li>
        <li>Another Ghost</li>
        <li>Very Spooky Placeholder</li>
      </ul>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
